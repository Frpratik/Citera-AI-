name: CI

on:
  push:
  pull_request:
  workflow_dispatch:          # lets you start the slow quality check by hand from the Actions tab

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:                # the same database image the app uses, with the vector add-on
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citera
          POSTGRES_PASSWORD: citera
          POSTGRES_DB: citera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch keeps this fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (the AI parts are faked, so no model downloads or API keys)
        run: pytest -q

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t citera-ai .

  quality-gate:
    name: Search quality gate (manual, uses the real models)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: citera
          POSTGRES_PASSWORD: citera
          POSTGRES_DB: citera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Run the quality gate
        run: RUN_EVAL=1 pytest -q tests/test_eval_gate.py
