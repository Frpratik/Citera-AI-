<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citera AI</title>
  <meta name="description" content="Ask questions about your PDFs and get answers with page numbers.">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>Citera AI <span class="tagline">Your documents. Your answers.</span></h1>
    <div id="user-area" class="user-area" hidden>
      <span id="user-email" class="user-email"></span>
      <button id="usage-btn" type="button" class="link-btn">Usage</button>
      <button id="logout-btn" type="button" class="link-btn">Log out</button>
    </div>
  </header>

  <main>
    <!-- Sign in / create account -->
    <section id="auth-view" class="card auth-card" aria-labelledby="auth-title">
      <h2 id="auth-title">Welcome</h2>
      <div class="tabs" role="tablist" aria-label="Account">
        <button id="tab-login" type="button" role="tab" aria-selected="true" class="tab active">Log in</button>
        <button id="tab-register" type="button" role="tab" aria-selected="false" class="tab">Create account</button>
      </div>
      <form id="auth-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        <p id="password-hint" class="hint" hidden>At least 8 characters.</p>
        <p id="auth-error" class="error" role="alert"></p>
        <button id="auth-submit" type="submit" class="primary">Log in</button>
      </form>
    </section>

    <!-- The app -->
    <div id="app-view" class="layout" hidden>
      <aside class="card docs-panel" aria-labelledby="docs-title">
        <h2 id="docs-title">Your documents</h2>
        <label class="upload-btn">
          <input id="file-input" type="file" accept="application/pdf,.pdf" multiple>
          <span>Upload PDF</span>
        </label>
        <p id="upload-status" class="hint" role="status"></p>
        <p id="doc-empty" class="hint">No documents yet. Upload a PDF to start asking questions about it.</p>
        <ul id="doc-list" class="doc-list"></ul>
      </aside>

      <section class="card chat-panel" aria-labelledby="chat-title">
        <div class="chat-head">
          <h2 id="chat-title">Chat</h2>
          <button id="clear-btn" type="button" class="link-btn">Clear history</button>
        </div>
        <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
        <form id="chat-form" class="chat-form">
          <label for="message-input" class="visually-hidden">Your question</label>
          <textarea id="message-input" rows="2" maxlength="2000" placeholder="Ask a question about your documents..." required></textarea>
          <button id="send-btn" type="submit" class="primary">Send</button>
        </form>
      </section>
    </div>
  </main>

  <dialog id="usage-dialog" aria-labelledby="usage-title">
    <h2 id="usage-title">Your usage (last 24 hours)</h2>
    <dl id="usage-list" class="usage-list"></dl>
    <button id="usage-close" type="button" class="primary">Close</button>
  </dialog>
</body>
</html>
